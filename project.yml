name: AirRec
options:
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AIRRECORD_AUTOMATION"
    MARKETING_VERSION: "1.4.2"
    CURRENT_PROJECT_VERSION: 45
targets:
  AirRec:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - Resources/moon.gif
      - path: Sources/Core
      - path: Sources/App/Resources/moon.gif
        buildPhase: resources
    dependencies:
      - framework: Frameworks/IDevice.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AIRRECORD_BUNDLE_IDENTIFIER)"
        # Existing App Intents keep this Swift module identity; the product is AirRec.
        PRODUCT_MODULE_NAME: iCTRL
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/Automation/AirRecord-Bridging-Header.h
        INFOPLIST_KEY_CFBundleDisplayName: "AirRec"
        INFOPLIST_KEY_CFBundleName: "AirRec"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "환영합니다! AirRec은 LocalDevVPN 사용을 위해 로컬 네트워크 접근 권한과 Wi-Fi 연결이 필요합니다."
        INFOPLIST_FILE: Sources/App/Info.plist
schemes:
  AirRec:
    build:
      targets:
        AirRec: all
